project_id = "flyeye"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[studio]
enabled = true
port = 55323

[local_smtp]
enabled = true
port = 55324
smtp_port = 55325
pop3_port = 55326
admin_email = "security@example.test"
sender_name = "FlyEye Local Security"

[analytics]
enabled = false
port = 55327
vector_port = 55328
backend = "postgres"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth/recovery", "http://127.0.0.1:4173/auth/recovery", "http://127.0.0.1:5173/auth/invitation", "http://127.0.0.1:4173/auth/invitation"]
enable_signup = false
minimum_password_length = 15
password_requirements = ""

[auth.rate_limit]
email_sent = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.email.template.recovery]
subject = "Reset your FlyEye password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "Your FlyEye school invitation"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Continue your FlyEye school invitation"
content_path = "./supabase/templates/magic_link.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Your FlyEye password was changed"
content_path = "./templates/password_changed_notification.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.auth-bootstrap]
enabled = true
verify_jwt = true

[functions.organization-admin-onboarding]
enabled = true
verify_jwt = true

[functions.member-invitations]
enabled = true
verify_jwt = true

[functions.member-administration]
enabled = true
verify_jwt = true

[functions.member-mfa]
enabled = true
verify_jwt = true

[functions.aircraft-registry]
enabled = true
verify_jwt = true

[functions.aircraft-documents]
enabled = true
verify_jwt = true
